---
title: à l'heure d'Halloween 🎃
preview_text: "Today, learn how to give the go-ahead"
color: "#F4E4D3"
goal: donner le départ
challenge:
  state: |
    Vous organisez une fête pour Halloween. Vos invités vous demandent à quelle heure ils peuvent arriver. Vous répondez :
  options:
  - option: De 20h.
  - option: À partir de 20h.
    correct: true
explanation:
  fr: |-
    Eh oui! **_à partir de_** est une locution
    qui permet d'introduire **le départ pour une durée ouverte**.
    Par exemple : _On est ouvert **à partir de** 8h._
    **_De_** est suivi de **_à_** et introduit **une durée fermée**.
    Par exemple : _On est ouvert **de** 8h **à** 13h._
  en: |
    “À partir de” means “starting from” and marks the beginning of something open-ended.
    “De… à…” sets clear limits and is for a closed time frame.
    Easy rule: if it has an end, use “de… à…”. If it just begins, go for “à partir de”.
words:
- fr: C'est parti !
  en: Here we go!
- fr: On commence quand tu veux.
  en: We can start whenever you want.
- fr: À partir de ce moment-là, c'était différent.
  en: From that moment on, things were different.
- fr: Rappelle-moi dès que tu reçois ce message.
  en: Call me back as soon as you get this message.
end_question: Allez, à mardi prochain, à partir de 7h30 !
