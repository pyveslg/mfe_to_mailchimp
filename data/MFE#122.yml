  en: |
    “les fêtes” is the correct French idiom to directly refer to the period that
    leads up to Christmas and ends just after New Year. Usually, the period matches
    school holidays.
words:
- fr: |
    Je rentre **à Noël**.
  en: I go home for Christmas.
- fr: |
    Je reste à Paris **pour les fêtes**.
  en: I stay in Paris during Christmastime.
- fr: |
    **Je passe Noël** en famille.
  en: I celebrate Christmas with my family.
- fr: |
    Je n'ai rien de prévu **pour la période de Noël**.
  en: I have no plan for Christmas time.
