---
title: on a pris votre commande ☕️
preview_text: "Today, learn how to get served"
color: "#D4EDE6"
goal: vous faire servir
challenge:
  state: |-
    Vous êtes au café.
    Un serveur vous demande si vous avez déjà commandé. Il dit :
  options:
  - option: On s'occupe de vous ?
    correct: true
  - option: On vous sert ?
explanation:
  fr: Eh oui ! **_s'occuper de quelqu'un_** signifie **offrir ses services à quelqu'un**.
  en: |
    “s'occuper de quelqu'un” means to attend to someone. So when a waiter asks “On s'occupe de vous?”, they're basically saying: “Are you being helped, or should I jump in?”
    Very French, very efficient.
words:
- fr: Non, pas encore.
  en: No, not yet.
- fr: On a pris ma commande.
  en: My order has been taken.
- fr: Je m'occupe de vous dans 1 minute !
  en: I'll be with you in one minute!
- fr: Je suis à vous dans un instant !
  en: I'll be with you in a moment!
end_question: Un autre mon French Expresso ? On s'occupe de vous dès mardi prochain !
