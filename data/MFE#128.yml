---
title: Trop de choses à faire ?
preview_text: Today, learn how to get busy
color: "#E4EDC0"
goal: avoir beaucoup de travail
challenge:
  state: |
    Votre collègue est stressé, il est en retard dans son travail.
    Vous essayez de l'aider. Vous lui demandez :
  options:
    - option: Qu'est-ce que tu as à faire ?
      correct: true
    - option: Qu'est-ce que tu dois faire ?
      correct: true
explanation:
  fr: |
    Eh oui ! Comme en anglais, **_avoir à + infinitif_** exprime **l'obligation et la contrainte**.
    C'est donc un **synonyme de _devoir_**.
    Attention, en général, on place le **complément entre _avoir_ et _à_** :
    **_avoir_** + complément + **_à_** + infinitif
    Par exemple :
    _J'**ai** des courses **à** faire_ | _J'**ai** un rapport **à** terminer_ | _J'**ai** des détails **à** régler._
  en: |
    Just like in English, “avoir à + infinitive” means you have to do something. It expresses obligation, just like “devoir”. The structure usually goes like this: avoir + complement + à + infinitive. Think of it as your French way of saying: "I've got stuff to get done!"
words:
- fr: Je suis débordé.
  en: I'm swamped.
- fr: J'ai beaucoup de choses à faire.
  en: I have a lot to do.
- fr: On a du pain sur la planche !
  en: We've got a lot on our plate!
- fr: Je suis sous l'eau !
  en: I'm drowning in work!
end_question: Et vous, avez-vous beaucoup de choses à faire cette semaine ?
