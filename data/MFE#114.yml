---
title: Pancakes ou stylos ? 🥞✏️
preview_text: Today, learn how to be honest
color: "#D0EFF1"
goal: être honnête
challenge:
  state: |
    Votre collègue vous a prêté un stylo. Vous dites :
  options:
  - option: Tiens, je te retourne ton stylo.
  - option: Tiens, je te rends ton stylo.
    correct: true
explanation:
  fr: |-
    Eh oui! _rendre_ signifie **rapporter à une personne un objet qui lui appartient**.
    Le verbe _retourner_ n'est pas adapté dans ce contexte :
    _retourner le stylo_ signifierait _tourner le stylo dans une position inversée_.
  en: |
    Easy rule: when you give something back to its owner, it's always “rendre”.
    “Retourner” is for flipping things over, like a pancake... not for giving back a pen. 😉
words:
- fr: C'est le tien ?
  en: Is this yours?
- fr: Je dois rendre les livres à la bibliothèque.
  en: I need to return the books to the library.
- fr: Je t'ai ramené ta veste.
  en: I brought you your jacket.
- fr: Il ne m'a pas rendu la monnaie.
  en: He didn't give me my change.
end_question: |-
  Et vous,
  avez-vous des livres à rendre à des amis ?
