  state: |
    Pour préparer votre repas de Thanksgiving, vous faites vos courses au marché.
    Pour payer vos achats, vous demandez :
  options:
  - option: Ça fait combien ?
    correct: true
  - option: Ça coûte combien ?
explanation:
  fr: |
    Eh oui ! **_Ça fait combien ?_** indique implicitement
    que **vous êtes prêt à payer** vos achats.
    La question **_Ça coûte combien ?_** permet de s'informer sur le prix.
  en: |
    In French, both “ça fait combien ?” and “ça coûte combien ?” mean “how much is it?”. But here's the trick: “ça fait combien ?” signals that you're ready to pay. “Ça coûte combien ?” is just to ask for the price, like browsing at a market stall before choosing. 
words:
- fr: Ça fait combien ?
  en: How much is it?
- fr: Je vous dois combien ?
  en: What do I owe?
- fr: Combien ça fait en tout ?
  en: How much is it altogether?
- fr: Dites-moi combien je vous dois.
  en: Tell me how much I owe you.
