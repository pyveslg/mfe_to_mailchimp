---
title: Vivement quelque chose… mais quoi ? 🎄
preview_text: Today, learn how to be impatient
color: "#CADBF1"
goal: être impatient
challenge:
  state: |
    Noël arrive et vous êtes impatient. Vous dites :
  options:
  - option: J'espère Noël avec impatience.
  - option: J'attends Noël avec impatience.
    correct: true
explanation:
  fr: |-
    Eh oui ! Ne confondez pas **_attendre_** et **_espérer_**.
    **_Attendre_** implique **la patience**. Par exemple : _J'**attends** que les vacances arrivent._
    **_Espérer_** implique **l'espoir et le désir**. Par exemple : _J'**espère** qu'il neigera à Noël._
  en: |
    Watch out, “attendre” and “espérer” are false friends in disguise. “attendre” is about waiting, with patience involved. Think of standing in line, maybe checking your phone every 30 seconds. “espérer” is about hope or a wish, something you want to happen but can't control. So you “attendez” Christmas, but you “espérez” snow.
words:
- fr: Vivement Noël !
  en: I can't wait for Christmas!
- fr: Chaque Noël, j'attends l'arrivée du Père-Noël.
  en: Every Christmas, I wait for Santa to arrive.
- fr: Il va arriver, il se fait un peu désirer.
  en: He's on his way. He's making us wait a bit.
- fr: Tout vient à point à qui sait attendre. 
  en: All things come to those who wait.
end_question: Et vous, fêtez-vous Noël ?
