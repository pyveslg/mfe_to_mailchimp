---
title: |
  OK pour moi ✅
preview_text: Today, learn how to admit the truth
color: "#C5D3ED"
goal: admettre la vérité
challenge:
  state: |
    Vous programmez vos visites pour la journée du patrimoine. Votre ami commente que Paris est la plus belle ville du monde. Vous dites :
  options:
  - option: Je d'accord avec toi !
  - option: Je suis d'accord avec toi !
    correct: true
explanation:
  fr: |
    Eh oui! **Paris est la plus belle ville du monde !** 😜
    Plus sérieusement, **_être d'accord_** signifie **donner son consentement ou son approbation**. **_D'accord_ n'est pas un verbe** :
    **_être_ est donc nécessaire** pour construire cette courte phrase.
  en: |-
    Paris may well be the most beautiful city in the world, but that's another story…
    “Être d'accord” means “to agree.” “D'accord” by itself isn't a verb — you need “être” to make a complete sentence. On its own, “D'accord” simply means “OK.”
words:
- fr: |
    **D'accord** !
  en: Alright!
- fr: |
    On **est d'accord sur** tout.
  en: We agree on everything.
- fr: |
    J'ai besoin de ton **accord**.
  en: I need your approval.
- fr: |
    On attend d'**avoir l'aval d**u responsable.
  en: We're waiting for the manager's approval.
end_question: Paris, la plus belle ville du monde ? Êtes-vous d'accord ?
