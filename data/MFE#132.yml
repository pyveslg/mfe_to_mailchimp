title: voilà pourquoi c'est vraiment important
preview_text: Today, learn how to justify yourself
color: |
  #E5B8D1
goal: vous justifier
challenge:
  state: |
    Votre collègue vous explique que la circulation peut être dangereuse à Paris.
    Vous dites :
  options:
  - option: C'est la raison pour laquelle j'évite le vélib.
    correct: true
  - option: C'est la raison pourquoi j'évite le vélib.
explanation:
  fr: |-
    Eh oui ! _**laquelle**_ **connecte deux phrases**
    et s'utilise **après une préposition** (_pour_, _sur_, _sous_, _avec_, _sans_, _dans_…).
    Attention, la forme change selon le contexte :
    _le pont sur **lequel**_ | _les outils avec **lesquels**_
     _la raison pour **laquelle**_ | _les tables sur **lesquelles**_
  en: |-
    “Lequel, laquelle, lesquels, lesquelles” are like grammatical Lego blocks: they connect two parts of a sentence, but only when a preposition comes before. Think of them as your go-to connectors after “pour,” “avec,” or “sans.” Skip them, and your French will sound a bit off.
words:
- fr: Voilà pourquoi c'est important.
  en: That's why it's important.
- fr: C'est pour ça que je suis là !
  en: That's why I'm here!
- fr: C'est bien pour ça que je fais appel à vous.
  en: That's exactly why I'm calling on you.
- fr: J'attends ce document, sans lequel je ne peux rien faire.
  en: I'm waiting for this document, without which I can't do anything.
end_question: Et vous, pourquoi apprenez-vous le français ?
